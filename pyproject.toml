[project]
name = "genesis-head-tracker"
version = "1.0.0"
description = "Cross-platform 6-DOF MediaPipe head tracker for ETS2/ATS and OpenTrack UDP (Windows & Linux)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "customtkinter>=6.0.0",
    "cv2-enumerate-cameras>=1.4.0",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pynput>=1.8.2",
]
